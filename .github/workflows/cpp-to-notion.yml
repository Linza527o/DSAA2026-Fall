name: C++ code to Notion AI Notes

on:
  push:
    branches:
      - main     # Change this if your repository's main branch has another name.
    paths:
      - '**/*.cpp'
      - '**/*.cc'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.hxx'
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Only this repository-relative C++ file (CLion button uses this)'
        type: string
        required: false
        default: ''
      full_resync:
        description: 'Scan all currently tracked C++ files, not just this push'
        type: boolean
        required: false
        default: true

# No repository write access. GitHub and Notion secrets are never hard-coded.
permissions:
  contents: read

# Serialize updates to the same Notion target from this repository/branch.
concurrency:
  group: cpp-notion-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout entire Git history for reliable before..after diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and sync Notion pages
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          DEEPSEEK_MODEL: deepseek-chat
          DEEPSEEK_MAX_TOKENS: '2048'
          NOTE_DETAIL: lite
          MAX_AI_CHARS: '12000'
          MAX_DIFF_CHARS: '4000'
          MAX_FILE_BYTES: '120000'
          MAX_FILES_PER_RUN: '100'
          SYNC_FILE: ${{ inputs.file_path || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$SYNC_FILE" ]; then
            python -m cpp_notion_sync --file "$SYNC_FILE"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python -m cpp_notion_sync --all
          else
            python -m cpp_notion_sync
          fi
